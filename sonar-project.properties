sonar.projectKey=Hostel-Management-System
sonar.projectName=HostelOps
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**,**/.env,**/*.log,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.webp,**/*.ico
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**,**/*.test.tsx,**/*.test.ts,frontend/src/test/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
