sonar.projectKey=Hostel-Management-System
sonar.projectName=HostelOps
sonar.projectVersion=2.0
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**,**/.env,**/*.log,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.webp,**/*.ico
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**,frontend/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
